services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ops"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
