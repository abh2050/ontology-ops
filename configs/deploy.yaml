# Deployment configuration. No account numbers, ARNs, or secrets belong here:
# preflight resolves the account and the ACM certificate at runtime.
project_tag: ontology-ops
stack_name: OntologyOpsStack
region: us-east-2              # single project region for infrastructure and Bedrock (D-023):
                               # the only region the account's SCP allows for ECS/RDS/ELB/etc.
aws_profile: awsnew            # local CLI profile used by preflight and CDK
# No custom domain (owner decision, D-024): public HTTPS is CloudFront's default
# *.cloudfront.net domain and AWS-managed certificate.
sizing:
  api: {cpu: 256, memory_mib: 512}
  worker: {cpu: 512, memory_mib: 1024}
  rds: {instance: t4g.micro, storage_gib: 20}
log_retention_days: 7
staging_expiry_days: 7
