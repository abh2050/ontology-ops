[project]
name = "ops"
version = "0.1.0"
description = "Ontology driven operational AI for delivery exception investigation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "boto3>=1.35",
  "pyyaml>=6.0",
  "typer>=0.13",
  "mlflow>=3.0",
  "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
ops = "ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/ops"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local PostgreSQL from compose.yaml"]
